[workspace]
members = ["crates/ordinata-core", "crates/ordinata-cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
authors = ["Flintglade <support@flintglade.com>"]
publish = false

[workspace.dependencies]
ordinata-core = { path = "crates/ordinata-core", version = "0.1.0" }

clap = { version = "4", features = ["derive", "std", "help", "usage", "error-context"], default-features = false }
csv = "1.3"
miniz_oxide = { version = "0.9", default-features = false, features = ["with-alloc"] }
nalgebra = { version = "0.34", default-features = false, features = ["std"] }
rand_chacha = { version = "0.9", default-features = false }
rand_core = { version = "0.9", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
time = { version = "0.3", default-features = false, features = ["std", "formatting", "parsing"] }

assert_cmd = "2"
cyclonedx-bom = "=0.8.1"
predicates = "3"
proptest = "1"
tempfile = "3"

# Lints are configured once for the whole workspace so that
# `cargo clippy --workspace --all-targets -- -D warnings` is the real gate.
[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# A panic in a released numerical instrument is an internal-invariant bug, never a
# control-flow tool. Test targets opt back in with a crate-level allow.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
# Every `as f64` in this workspace widens a count that the input limits keep far
# below 2^53 (at most 50_000 rows, 256 parameters, 10_000 bootstrap samples), so
# the widening is exact.
cast_precision_loss = "allow"
# `#[must_use]` on plain accessors is noise for a binary-shaped workspace.
must_use_candidate = "allow"
# `ordinata_core::error::Error` reads better than `error::OrdinataError`.
module_name_repetitions = "allow"
# Linear algebra genuinely has `sigma`/`sigmas` and `lambda`/`lambdas` side by side.
similar_names = "allow"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
strip = "symbols"
debug = false
incremental = false
overflow-checks = true

[profile.dev]
overflow-checks = true
